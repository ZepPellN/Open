name: Standalone projects
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Slides browser source
        working-directory: slides
        run: |
          npm ci
          python3 run.py demo
          python3 run.py test
      - name: Independent Dashboard
        working-directory: dashboard
        run: |
          python3 run.py demo
          python3 run.py test
      - name: Upstream Design and wrapper
        working-directory: design
        run: |
          python3 run.py demo
          python3 run.py test
      - name: Standalone Skill installation
        run: |
          python3 -m unittest discover -s tests
