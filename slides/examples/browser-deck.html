<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Slides</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:#14243b;font-family:Arial,sans-serif}
deck-stage{width:100%;height:calc(100dvh - 74px);margin-top:74px}deck-stage:not(:defined){visibility:hidden}
section{padding:86px 100px;background:#fbfaf7;color:#14243b;display:flex;flex-direction:column;justify-content:center;gap:24px}
h1{margin:0;max-width:950px;font-size:64px;line-height:1.08}p{margin:0;font-size:30px;line-height:1.4;color:#52617a}
[data-open-controls]{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;padding:12px 16px;min-height:64px;border-bottom:1px solid #d8dde3}
button{background:#183a66;color:#fff;border:0;border-radius:6px;padding:10px 12px;font:14px Arial,sans-serif;cursor:pointer}
button:disabled{opacity:.5}button[aria-pressed=true]{background:#386849}[role=status]{font-size:13px;color:#52617a;margin-left:auto}
[contenteditable=true]{outline:2px dashed #658296;outline-offset:4px}
@media(max-width:640px){deck-stage{margin-top:132px;height:calc(100dvh - 132px)}[role=status]{margin:0;width:100%}}
@media print{[data-open-controls]{display:none}deck-stage{margin:0;height:auto}}
</style>
</head>
<body>
<nav aria-label="Open Slides controls" data-open-controls>
<button type="button" data-edit aria-pressed="false">Edit text</button>
<button type="button" data-save>Save HTML</button>
<button type="button" data-export>Export PPTX</button>
<button type="button" data-print>Print / PDF</button>
<span role="status" aria-live="polite">Runs in your own browser.</span>
</nav>
<deck-stage width="1280" height="720" no-rail>
<section data-label="Room to breathe" data-notes="A two-slide synthetic example."><p>OPEN SLIDES · 01</p><h1>Ideas deserve room to breathe.</h1><p>Click Edit text to change this deck. Click Export PPTX to download it.</p></section>
<section data-label="Your browser"><p>OPEN SLIDES · 02</p><h1>Your browser is all you need.</h1><p>Save HTML keeps your edits. PPTX exports native text, shapes and images.</p></section>
</deck-stage>
<script>{{DECK_STAGE}}</script>
<script>{{OPEN_SLIDES_BROWSER}}</script>
</body>
</html>
